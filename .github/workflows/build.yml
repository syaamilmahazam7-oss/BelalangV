name: Build BelalangV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Pilihan: google-services.json datang dari GitHub Secret (base64), bukan dari Git.
      - name: Tulis google-services.json (jika secret ada)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "google-services.json ditulis."
          else
            echo "Secret GOOGLE_SERVICES_JSON_B64 tiada: APK dibina tanpa Firebase."
          fi

      - name: Unit test
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BelalangV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
