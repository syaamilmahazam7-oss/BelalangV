name: Build BelalangV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Pilihan: google-services.json datang dari GitHub Secret (base64), bukan dari Git.
      - name: Tulis google-services.json (jika secret ada)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "google-services.json ditulis."
          else
            echo "Secret GOOGLE_SERVICES_JSON_B64 tiada: APK dibina tanpa Firebase."
          fi

      - name: Unit test
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest > gradle-test.log 2>&1
          rc=$?
          # Paparkan ralat penting sebagai annotation supaya mudah dibaca.
          grep -E "^e: |FAILED|What went wrong|Could not|error:|AssertionError|Exception" gradle-test.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $rc

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > gradle-build.log 2>&1
          rc=$?
          grep -E "^e: |FAILED|What went wrong|Could not|error:" gradle-build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: BelalangV-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Terbitkan APK sebagai Release 'latest' (hanya push ke main) supaya mudah dimuat turun.
      - name: Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk BelalangV-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BelalangV-debug.apk --title "BelalangV latest" --notes "Build ${GITHUB_SHA::7}" --target "$GITHUB_SHA"

      # Terbitkan APK sebagai Release 'latest' (hanya push ke main) supaya mudah dimuat turun.
      - name: Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk BelalangV-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BelalangV-debug.apk --title "BelalangV latest" --notes "Build ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
